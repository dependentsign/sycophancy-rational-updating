[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sycophancy-rational-updating"
version = "1.0.0"
description = "A two-turn diagnostic that measures Unsupported-Yielding and Rational-Updating separately, for any chat model."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Huanhuan Ma", email = "hma42@uic.edu" }]
keywords = ["sycophancy", "evaluation", "llm", "benchmark", "alignment"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["tqdm>=4.66"]

[project.optional-dependencies]
# Local weights, the path the paper's numbers were produced on.
hf = ["torch>=2.1", "transformers>=4.51", "accelerate>=0.26"]
# Hosted models and any OpenAI-compatible server.
api = ["openai>=1.40", "anthropic>=0.40"]
all = ["torch>=2.1", "transformers>=4.51", "accelerate>=0.26",
       "openai>=1.40", "anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
sru = "sru.cli:main"

[project.urls]
Homepage = "https://github.com/dependentsign/sycophancy-rational-updating"
Paper = "https://arxiv.org/abs/2608.26511"

[tool.setuptools]
# The evaluation data lives at the repository root, where it is browsable and
# the README can link to it. Mapping it in as `sru_data` puts it in the wheel
# too, so `pip install git+...` gets a working tool and not just the code.
packages = ["sru", "sru.backends", "sru_data"]

[tool.setuptools.package-dir]
sru_data = "data"

[tool.setuptools.package-data]
sru_data = ["*.jsonl", "*.json", "splits/*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
